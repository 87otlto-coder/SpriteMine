name: MesenCE Lua probe research checks

on:
  pull_request:
    paths:
      - "research/**"
      - "tests/test_research_capture.py"
      - "tests/test_phase_capture.py"
      - "tests/test_render_capture.py"
      - ".github/workflows/research-lua.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lua-probe:
    name: Lua 5.4 syntax and synthetic emulator checks (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: step-security/msvc-dev-cmd@v1
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.4.8"
          buildCache: "false"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Validate Lua syntax and all historical synthetic MesenCE captures
        run: python -m research.mesence.ci_mock_checks
