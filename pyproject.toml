[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spritemine"
version = "0.1.0"
description = "Read-only NES asset exploration, beginning with Super Mario Bros. 3"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - all rights reserved" }
dependencies = ["Pillow>=10,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
spritemine = "spritemine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
